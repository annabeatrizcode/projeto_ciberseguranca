
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | CyberSec</title>

    <link rel="stylesheet" href="../CSS/cadastro.css">
</head>

<body>

    <header>
        <h1>CyberSec</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="cursos.html">Cursos</a>
            <a href="certificado.html">Validar Certificado</a>
            <a href="login.html">Área do Aluno</a>
        </nav>
    </header>

    <main class="login-container">

        <div class="login-box">

            <h2>Crie sua Conta</h2>

            <p class="subtitulo">
                Cadastre-se e comece sua jornada na cibersegurança.
            </p>

            <form id="formCadastro">

                <label for="nome">Nome Completo</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome completo" required>

                <label for="email">E-mail</label>
                <input type="email" id="email"
                    placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha"
                    placeholder="Digite sua senha" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar"
                    placeholder="Confirme sua senha" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p class="cadastro">
                Já possui uma conta?
                <a href="login.html">Faça Login</a>
            </p>

        </div>

    </main>

    <footer>
        <p>Desenvolvido por Anna Beatriz</p>
        <p>© 2026 - Todos os direitos reservados.</p>
    </footer>

    <script src="../javascript/cadastro.js"></script>

</body>
</html>
